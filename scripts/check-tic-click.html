<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<style>
:root {
	--interactive-accent: Highlight;
	--text-normal: CanvasText;
	--text-muted: GrayText;
	--background-modifier-hover: ButtonFace;
	--size-2-1: 2px;
	--size-4-1: 4px;
	--size-4-2: 8px;
	--font-ui-small: 13px;
	--radius-s: 4px;
}
.finition-test-ai-layout {
	width: 700px;
	height: 800px;
	overflow: auto;
	font: 23px/1.5 Menlo, monospace;
}
.finition-test-ai-layout > .cm-editor { height: 100%; }
.finition-test-ai-layout .cm-scroller { overflow: auto; }
.finition-test-ai-preview { width: 500px; }
.finition-test-ai-preview.mod-cm6 .cm-editor .cm-content { padding-left: 40px; }
.finition-test-ai-layout.markdown-source-view.mod-cm6.is-live-preview .cm-line:has(> br) {
	height: 0.7rem;
	text-indent: 2rem;
}
.finition-test-correction-wrap {
	width: 360px;
	font: 20px/1.5 monospace;
}
.finition-test-correction-wrap-wide { width: 520px; }
.cm-editor .cm-scroller.finition-test-correction-scroll { height: 180px; overflow: auto; }
</style>
<div id="editor"></div>
<input id="neural-files" type="file" multiple hidden>
<pre id="result">PENDING</pre>
<pre id="neural-metrics"></pre>
<script src="check.js"></script>
